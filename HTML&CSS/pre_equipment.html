<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>備品貸し出し</title>
    <link rel="stylesheet" href="pre_style.css">
    <style>
        .eq-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .eq-status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            color: white;
        }
        .status-available { background-color: #28a745; } /* 緑 */
        .status-loaned { background-color: #dc3545; }    /* 赤 */
        .tab-btn {
            flex: 1; padding: 10px; border: none; background: #eee; cursor: pointer;
        }
        .tab-btn.active {
            background: #007bff; color: white; font-weight: bold;
        }
    </style>
</head>
<body id="page-equipment">

    <div id="common-appbar"></div>

    <div class="container" style="margin-top:70px; padding-bottom:80px;">
        <h2>備品貸し出しセンター</h2>

        <div style="display:flex; border-radius:8px; overflow:hidden; margin-bottom:20px;">
            <button class="tab-btn active" onclick="switchEqTab('request')">貸出申請</button>
            <button class="tab-btn" onclick="switchEqTab('list')">貸出状況一覧</button>
        </div>

        <div id="tab-request">
            <div class="card">
                <h3>新規申請</h3>
                <div class="form-group">
                    <label>借りたい備品</label>
                    <select id="eqSelect" class="form-control" onchange="checkEqAvailability()">
                        <option value="">選択してください</option>
                    </select>
                    <div id="eqInfoMsg" style="font-size:0.9em; color:#666; margin-top:5px;"></div>
                </div>

                <div class="form-group">
                    <label>貸出開始日</label>
                    <input type="date" id="eqStartDate" class="form-control" onchange="validateEqDates()">
                </div>

                <div class="form-group">
                    <label>返却予定日</label>
                    <input type="date" id="eqEndDate" class="form-control" onchange="validateEqDates()">
                </div>

                <button class="btn-primary" onclick="submitEqRequest()" style="width:100%; margin-top:10px;">申請する</button>
            </div>

            <h3 style="margin-top:30px;">あなたの申請履歴</h3>
            <div id="myEqHistory">読み込み中...</div>
        </div>

        <div id="tab-list" style="display:none;">
            <div id="eqListContainer">読み込み中...</div>
        </div>
    </div>

    <div id="common-bottom-nav"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <script src="../pre_JS/pre_common.js"></script>
    <script src="../pre_JS/pre_equipment.js"></script>
</body>
</html>
