<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者画面 | 統合アプリ</title>
    <link rel="stylesheet" href="../pre_CSS/pre_style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
</head>
<body id="page-admin">

<header class="appbar-fixed">
    <div class="appbar-side">
        <a href="pre_home.html" class="icon-btn">🏠</a>
    </div>
    <div class="appbar-center">管理者コンソール</div>
    <div class="appbar-side">
        <a href="pre_settings.html" class="icon-btn">⚙️</a>
    </div>
</header>

<main class="content" style="padding-top: 80px;">
    <div class="admin-container">
        
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('status', this)">ステータス</button>
            <button class="tab-btn" onclick="switchTab('users', this)">ユーザー</button>
            <button class="tab-btn" onclick="switchTab('auth', this)">認証リクエスト</button>
            <button class="tab-btn" onclick="switchTab('approval', this)">備品承認</button> 
        </div>

        <div id="tab-status" class="tab-content">
            
            <div id="equipment-manage-area"></div>

            <div class="admin-section">
                <h3>キャンパス管理</h3>
                <div class="card" style="background:#f9f9f9;">
                    <h4>新規キャンパス登録</h4>
                    <div class="form-group">
                        <label>キャンパス名</label>
                        <input type="text" id="newCampusName" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>緯度 (Latitude)</label>
                        <input type="number" step="any" id="newCampusLat" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>経度 (Longitude)</label>
                        <input type="number" step="any" id="newCampusLon" class="form-control">
                    </div>
                    <button class="btn-primary" onclick="addCampus()">登録</button>
                </div>
                
                <div id="status-list" style="margin-top:20px;">
                    </div>
            </div>
            
            <div class="admin-section" style="margin-top:30px; border-top:2px solid #ddd; padding-top:20px;">
                <details>
                    <summary style="cursor:pointer; font-weight:bold; font-size:1.1em;">▼ カレンダー・学年暦設定を開く</summary>
                    <div style="margin-top:10px; padding:10px; background:#fff; border:1px solid #ddd; border-radius:5px;">
                        <h4>学年暦 (年度設定)</h4>
                        <div class="form-group">
                            <label>対象年度 (4月始まり)</label>
                            <input type="number" id="acadYear" class="form-control" style="width:100px;">
                        </div>
                        <button onclick="loadAcademicConfigByYear()" class="btn-secondary">設定読み込み/作成</button>
                        <div id="academic-config-area" style="margin-top:10px; border:1px solid #ccc; padding:5px;"></div>
                    </div>
                </details>

                <div class="form-group" style="margin-top:20px;">
                    <label>対象月 (月次カレンダー)</label>
                    <input type="month" id="targetMonth" class="form-control" onchange="loadMonthConfig()">
                </div>
                <button onclick="previewCalendar()" style="margin-top:15px; background:#ff9800; color:white; padding:8px 16px; border:none; border-radius:4px;">プレビュー更新</button>
                
                <div id="month-config-area"></div>

                <div id="adminCalPreview" class="calendar-wrapper" style="margin-top:10px; border:2px dashed #ccc;">
                    <p style="text-align:center; padding:20px;">プレビューエリア</p>
                </div>

                <button onclick="saveMonthCalendar()" class="btn-primary" style="width:100%; margin-top:15px;">この内容で保存・公開</button>
            </div>
        </div>

        <div id="tab-users" class="tab-content" style="display:none;">
            <h3>ユーザー一覧</h3>
            <button class="btn-primary" onclick="refreshAllUsers()">一覧更新</button>
            <div id="user-list" style="margin-top:15px;"></div>
        </div>

        <div id="tab-auth" class="tab-content" style="display:none;">
            <h3>認証リクエスト一覧</h3>
            <button class="btn-primary" onclick="refreshAuthList()">一覧更新</button>
            <div id="auth-list" style="margin-top:15px;"></div>
        </div>

        <div id="tab-approval" class="tab-content" style="display:none;">
            <h3>備品貸出申請一覧</h3>
            <button class="btn-primary" onclick="refreshEquipmentRequests()">一覧更新</button>
            <div id="approval-list" style="margin-top:15px;">
                </div>
        </div>

    </div>

    <div id="authModal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <span class="close" onclick="closeAuthModal()">&times;</span>
            <h3 id="modalTitle">認証</h3>
            <p id="adminAuthStatus" style="color:red; font-weight:bold;">待機中...</p>
            <div class="camera-wrapper">
                <video id="adminVideo" autoplay playsinline></video>
                <canvas id="adminCanvas" class="overlay"></canvas>
            </div>
            <button id="approveBtn" class="btn-primary" onclick="approveRequest()" disabled style="margin-top:15px; width:100%; padding:15px;">承認する</button>
        </div>
    </div>

</main>

<script src="../pre_JS/pre_common.js"></script>
<script src="../pre_JS/pre_admin.js"></script>
<script>
    // タブ切り替え関数 (インラインスクリプトの更新)
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.getElementById('tab-' + tabId).style.display = 'block';
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');

        // タブごとの初期化呼び出し
        if (tabId === 'status') {
            if(typeof refreshCampusStatusList === 'function') refreshCampusStatusList();
            // ★追加: ステータスタブを開いたときに備品一覧も更新
            if(typeof refreshAdminEquipmentList === 'function') refreshAdminEquipmentList();
        } else if (tabId === 'users') {
            if(typeof refreshAllUsers === 'function') refreshAllUsers();
        } else if (tabId === 'auth') {
            if(typeof refreshAuthList === 'function') refreshAuthList();
        } else if (tabId === 'approval') {
            // ★追加: 備品承認タブ
            if(typeof refreshEquipmentRequests === 'function') refreshEquipmentRequests();
        }
    }
</script>
</body>
</html>
