<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カリキュラム</title>
    <link rel="stylesheet" href="pre_style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        /* ベース設定: 余白を消し、スクロールを制御 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 親側のスクロールを禁止 */
        }
        
        /* Iframeラッパー: iOSでの幅広がりを防ぐためのコンテナ */
        .iframe-container {
            width: 100%;
            /* ヘッダー(70px)を引いた高さ。dvhはiOSのアドレスバー伸縮に対応 */
            height: calc(100dvh - 70px); 
            overflow-y: auto; /* ここでスクロールさせる */
            -webkit-overflow-scrolling: touch; /* iOSでの慣性スクロール有効化 */
        }

        /* Iframe本体 */
        #curriculumFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe id="curriculumFrame" src="https://ryukoku-horizon.github.io/horizon-atlas" allow="geolocation; microphone; camera"></iframe>
    </div>

    <script src="../pre_JS/pre_common.js"></script>
    <script src="../pre_JS/pre_curriculum.js"></script>
</body>
</html>
