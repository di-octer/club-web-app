<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者アプリ (Web版)</title>
    <link rel="stylesheet" href="pre_style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body id="page-admin">

<div class="admin-container">
    <header><h2>管理者コンソール</h2></header>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('status', this)">ステータス</button>
        <button class="tab-btn" onclick="switchTab('info', this)">登録情報</button>
        <button class="tab-btn" onclick="switchTab('face', this)">顔登録</button>
        <button class="tab-btn" onclick="switchTab('calendar', this)">カレンダー設定</button>
    </div>

    <div id="tab-status" class="tab-content active">
        <div style="display: flex; flex-wrap: wrap; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; overflow: hidden;">
            <button id="btn-sub-auth" class="sub-tab active" onclick="switchAdminSubTab('auth')">出席認証</button>
            <button id="btn-sub-report" class="sub-tab" onclick="switchAdminSubTab('report')">届出・連絡</button>
            <button id="btn-sub-recurring" class="sub-tab" onclick="switchAdminSubTab('recurring')">定期欠席</button>
        </div>

        <div id="view-auth">
            <div id="requestList" class="list-container"><p>読み込み中...</p></div>
            <button onclick="refreshRequests()" class="refresh-btn">リクエスト更新</button>
        </div>

        <div id="view-report" style="display: none;">
            <div id="reportList" class="list-container"><p>読み込み中...</p></div>
            <button onclick="refreshReports()" class="refresh-btn">リスト更新</button>
        </div>

        <div id="view-recurring" style="display: none;">
            <h3>定期欠席申請 (時間割写真)</h3>
            <div id="recurringList" class="list-container"><p>読み込み中...</p></div>
            <button onclick="refreshRecurring()" class="refresh-btn">更新</button>
        </div>
        
        <div id="authModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" onclick="closeAuthModal()">&times;</span>
                <h3 id="modalTitle">認証処理</h3>
                <div class="camera-wrapper">
                    <video id="adminVideo" autoplay muted playsinline></video>
                    <canvas id="adminCanvas" class="overlay"></canvas>
                </div>
                <div id="adminAuthStatus" style="margin: 10px 0; font-weight: bold;">コードを枠に合わせてください</div>
                <button id="approveBtn" disabled onclick="approveRequest()" class="btn-primary" style="background-color: #28a745;">承認する</button>
            </div>
        </div>
    </div>

    <div id="tab-info" class="tab-content">
        
        <details class="settings-details">
            <summary>ニュース登録</summary>
            <div class="details-content">
                <div class="input-group">
                    <input type="text" id="qiitaInput" placeholder="例: https://qiita.com/items/...">
                    <button onclick="registerRecommendedArticle()">追加</button>
                </div>
                <div id="adminNewsList" class="list-container"></div>
            </div>
        </details>

        <details class="settings-details" open>
            <summary>活動場所設定 (一覧・削除)</summary>
            <div class="details-content">
                <div id="hierarchyList" class="list-container" style="border:none; padding:0;"></div>
            </div>
        </details>

        <details class="settings-details">
            <summary>新規キャンパス登録</summary>
            <div class="details-content">
                <div class="input-group">
                    <input type="text" id="campusName" placeholder="キャンパス名">
                    <input type="number" id="campusLat" placeholder="緯度" step="0.000001">
                    <input type="number" id="campusLon" placeholder="経度" step="0.000001">
                    <button onclick="registerCampus()">登録</button>
                </div>
            </div>
        </details>

        <details class="settings-details">
            <summary>新規活動場所登録</summary>
            <div class="details-content">
                <div class="input-group">
                    <select id="campusSelect"><option>キャンパスを選択</option></select>
                    <input type="text" id="areaName" placeholder="場所名">
                    <input type="number" id="areaLat" placeholder="緯度" step="0.000001">
                    <input type="number" id="areaLon" placeholder="経度" step="0.000001">
                    <button onclick="registerArea()">登録</button>
                </div>
            </div>
        </details>

        <details class="settings-details">
            <summary>ユーザー情報</summary>
            <div class="details-content">
                <div id="allUsersList" class="list-container"><p>読み込み中...</p></div>
                <button onclick="refreshAllUsers()" class="refresh-btn" style="margin-top:10px;">リスト更新</button>
            </div>
        </details>
    </div>

    <div id="tab-face" class="tab-content">
        <h3>新規顔登録 (5段階)</h3>
        <p style="font-size:0.9em; color:#666;">登録するユーザーを選択してください</p>
        <div class="input-group">
            <select id="regUserSelect" style="margin-bottom:10px; padding:10px; font-size:1.1em;">
                <option value="">ユーザー読み込み中...</option>
            </select>
            <button id="regStartBtn" onclick="startFaceRegistration()">開始</button>
        </div>
        
        <div class="camera-wrapper">
            <video id="regVideo" autoplay muted playsinline></video>
            <canvas id="regCanvas" class="overlay"></canvas>
        </div>
        
        <button id="regNextBtn" onclick="proceedToNextStep()" disabled style="width:100%; padding:15px; background-color:#ccc; border:none; border-radius:5px; color:white; margin-top:15px;">撮影・次へ</button>
        <div id="regStatus" style="margin-top:10px;">待機中...</div>
    </div>

    <div id="tab-calendar" class="tab-content">
        <h3>カレンダー・学年暦設定</h3>
        
        <div style="display: flex; flex-wrap: wrap; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; overflow: hidden;">
            <button id="btn-sub-acad" class="sub-tab active" onclick="switchCalendarSubTab('acad')">学年暦設定</button>
            <button id="btn-sub-monthly" class="sub-tab" onclick="switchCalendarSubTab('monthly')">月次作成</button>
        </div>

        <div id="view-acad">
            <p style="font-size:0.9em; color:#666;">年度を入力すると、日付の「年」は自動計算・固定されます。</p>
            <div class="input-group">
                <label>設定年度</label>
                <input type="number" id="acadYear" value="2024" oninput="updateAllAcadDates()">
            </div>
            <details open class="settings-details">
                <summary>学期期間</summary>
                <div class="details-content">
                    <label>前期 (前半/後半)</label>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <input type="date" id="t1_start" class="acad-date" oninput="enforceAcadYear(this)"> ～ 
                        <input type="date" id="t1_mid" class="acad-date" oninput="enforceAcadYear(this)"> / 
                        <input type="date" id="t1_end" class="acad-date" oninput="enforceAcadYear(this)">
                    </div>
                    <label style="margin-top:10px;">後期 (前半/後半)</label>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <input type="date" id="t2_start" class="acad-date" oninput="enforceAcadYear(this)"> ～ 
                        <input type="date" id="t2_mid" class="acad-date" oninput="enforceAcadYear(this)"> / 
                        <input type="date" id="t2_end" class="acad-date" oninput="enforceAcadYear(this)">
                    </div>
                </div>
            </details>
            <details class="settings-details">
                <summary>特殊期間 (試験・補講など)</summary>
                <div class="details-content">
                    <label>履修登録期間 (YYYY-MM-DD形式で入力)</label> 
                    <input type="text" id="p_reg" placeholder="YYYY-MM-DD:YYYY-MM-DD">
                    
                    <label>集中補講期間</label> 
                    <input type="text" id="p_sup" placeholder="YYYY-MM-DD:YYYY-MM-DD">
                    
                    <label>試験期間</label> 
                    <input type="text" id="p_exam" placeholder="YYYY-MM-DD:YYYY-MM-DD">
                    
                    <label>成績発表日</label> 
                    <input type="date" id="d_grade" class="acad-date" oninput="enforceAcadYear(this)">
                </div>
            </details>
            <button onclick="saveAcademicConfig()" class="btn-primary" style="width:100%; margin-top:10px;">保存</button>
        </div>

        <div id="view-monthly" style="display:none;">
            <div class="input-group">
                <label>対象年月 <small style="color:#666;">※形式: YYYY-MM</small></label>
                <input type="month" id="targetMonth" onchange="updateMonthlyBaseYear()">
                <button onclick="loadMonthConfig()">読み込み</button>
            </div>
            
            <details class="settings-details">
                <summary>活動日設定 (曜日)</summary>
                <div class="details-content">
                    <div id="campusActivitySettings"></div>
                </div>
            </details>

            <details class="settings-details" open>
                <summary>イベント・スケジュール</summary>
                <div class="details-content">
                    <div class="input-group">
                        <label>種別</label>
                        <select id="evtType">
                            <option value="general">総会</option>
                            <option value="radio">ラジオ</option>
                            <option value="camp">合宿</option>
                            <option value="dev_basic">基礎班開発</option>
                            <option value="dev_adv">発展班開発</option>
                            <option value="trial">仮入部</option>
                            <option value="event">その他イベント</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>期間 (1日の場合は開始のみ)</label>
                        <div style="display:flex; gap:5px; align-items:center;">
                            <input type="date" id="evtStart" oninput="enforceMonthlyYear(this)"> ～ 
                            <input type="date" id="evtEnd" oninput="enforceMonthlyYear(this)">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>タイトル</label>
                        <input type="text" id="evtTitle">
                    </div>
                    <button onclick="addCalendarEvent()">リストに追加</button>
                    <div id="tempEventList" style="margin-top:10px; border:1px solid #ccc; padding:5px;"></div>
                </div>
            </details>

            <button onclick="previewCalendar()" style="margin-top:15px; background:#ff9800; color:white;">プレビュー更新</button>
            
            <div id="adminCalPreview" class="calendar-wrapper" style="margin-top:10px; border:2px dashed #ccc;">
                <p style="text-align:center; padding:20px;">プレビューエリア</p>
            </div>

            <button onclick="saveMonthCalendar()" class="btn-primary" style="width:100%; margin-top:15px;">この内容で保存・公開</button>
        </div>
    </div>
    
</div>
<script src="pre_script.js"></script>
</body>
</html>
