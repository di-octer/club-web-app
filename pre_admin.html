<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者アプリ (Web版)</title>
    <link rel="stylesheet" href="pre_style.css">
    <style>
        /* 管理者画面固有のスタイル */
        
        /* アコーディオン & リストスタイル */
        details { border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; background: #fff; overflow: hidden; text-align: left; }
        summary { padding: 10px 15px; background-color: #f8f9fa; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; list-style: none; }
        summary::-webkit-details-marker { display: none; } /* デフォルトの三角を消す */
        .details-content { padding: 10px; border-top: 1px solid #ddd; background: #fff; }
        
        /* サブタブ (ステータス画面用) */
        .sub-tab { flex: 1; padding: 10px; border: none; background: #eee; color: #333; cursor: pointer; transition: 0.3s; }
        .sub-tab.active { background: #007bff !important; color: white !important; }

        /* ボタン系 */
        .btn-danger { background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 5px 10px; font-size: 0.8em; }
        .btn-danger:hover { background-color: #c82333; }
        .refresh-btn { margin-top: 10px; padding: 8px 16px; background-color: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; }

        /* リストアイテム */
        .list-item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .list-item-row:last-child { border-bottom: none; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 10px; }
        
        /* 階層表示用 */
        .nested-area { margin-left: 20px; border-left: 3px solid #007bff; padding-left: 10px; margin-top: 5px; margin-bottom: 5px; background-color: #fdfdfd; }
        
        /* セクションヘッダー */
        .info-header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 10px; border-bottom: 2px solid #eee; padding-bottom: 5px; }

        /* カメラエリア */
        .camera-wrapper { position: relative; width: 100%; max-width: 400px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; display: block; }
        canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* モーダル */
        .modal { position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
        .modal-content { background-color: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; text-align: center; position: relative; }
        .close { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body id="page-admin">

<div class="admin-container">
    <header>
        <h2>管理者コンソール</h2>
    </header>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('status')">ステータス</button>
        <button class="tab-btn" onclick="switchTab('info')">登録情報</button>
        <button class="tab-btn" onclick="switchTab('face')">顔登録</button>
    </div>

    <div id="tab-status" class="tab-content active">
        <div style="display: flex; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; overflow: hidden;">
            <button id="btn-sub-auth" class="sub-tab active" onclick="switchAdminSubTab('auth')">出席認証待ち</button>
            <button id="btn-sub-report" class="sub-tab" onclick="switchAdminSubTab('report')">届出・連絡</button>
        </div>

        <div id="view-auth">
            <div id="requestList" class="list-container"><p>読み込み中...</p></div>
            <button onclick="refreshRequests()" class="refresh-btn">リクエスト更新</button>
        </div>

        <div id="view-report" style="display: none;">
            <div id="reportList" class="list-container"><p>読み込み中...</p></div>
            <button onclick="refreshReports()" class="refresh-btn">リスト更新</button>
        </div>
        
        <div id="authModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" onclick="closeAuthModal()">&times;</span>
                <h3 id="modalTitle">認証処理</h3>
                <div class="camera-wrapper">
                    <video id="adminVideo" autoplay muted playsinline></video>
                    <canvas id="adminCanvas" class="overlay"></canvas>
                </div>
                <div id="adminAuthStatus" style="margin: 10px 0; font-weight: bold;">コードを枠に合わせてください</div>
                <button id="approveBtn" disabled onclick="approveRequest()" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 1.1em;">承認する</button>
            </div>
        </div>
    </div>

    <div id="tab-info" class="tab-content">
        
        <details open>
            <summary>管理者おすすめニュース設定 (Qiita)</summary>
            <div class="details-content">
                <p style="font-size:0.8em; color:#666;">Qiita記事のURLを入力するとタイトルを自動取得して登録します。</p>
                <div class="input-group">
                    <input type="text" id="qiitaInput" placeholder="例: https://qiita.com/user/items/...">
                    <button onclick="registerRecommendedArticle()">追加</button>
                </div>
                <div id="adminNewsList" class="list-container"></div>
            </div>
        </details>

        <hr>

        <details>
            <summary>新規キャンパス登録</summary>
            <div class="details-content">
                <div class="input-group">
                    <input type="text" id="campusName" placeholder="キャンパス名">
                    <input type="number" id="campusLat" placeholder="緯度" step="0.000001">
                    <input type="number" id="campusLon" placeholder="経度" step="0.000001">
                    <button onclick="registerCampus()">登録</button>
                </div>
            </div>
        </details>

        <details>
            <summary>新規活動場所登録</summary>
            <div class="details-content">
                <div class="input-group">
                    <select id="campusSelect"><option>キャンパスを選択</option></select>
                    <input type="text" id="areaName" placeholder="場所名">
                    <input type="number" id="areaLat" placeholder="緯度" step="0.000001">
                    <input type="number" id="areaLon" placeholder="経度" step="0.000001">
                    <button onclick="registerArea()">登録</button>
                </div>
            </div>
        </details>

        <div class="info-header">
            <h3>キャンパス・活動場所</h3>
            <button class="btn-danger" onclick="deleteSelectedItems('campuses')">選択キャンパスを削除</button>
        </div>
        <div id="hierarchyList" class="list-container" style="max-height: none;"></div>

        <div class="info-header" style="margin-top: 40px;">
            <h3>登録済み顔データ</h3>
            <div style="display: flex; gap: 10px;">
                <button class="btn-danger" onclick="deleteSelectedItems('faces')">選択削除</button>
                <button class="btn-danger" onclick="deleteAll('faces')">全削除</button>
            </div>
        </div>
        
        <details>
            <summary>顔データ一覧を表示</summary>
            <div class="details-content">
                <div id="faceList" class="list-container" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </details>
    </div>

    <div id="tab-face" class="tab-content">
        <h3>新規顔登録 (5段階・手動)</h3>
        <p>正面 -> 左 -> 右 -> 上 -> 下 の順に撮影します</p>
        
        <div class="camera-wrapper">
            <video id="regVideo" autoplay muted playsinline></video>
            <canvas id="regCanvas" class="overlay"></canvas>
        </div>
        
        <div class="input-group" style="margin-top: 10px;">
            <input type="text" id="regName" placeholder="登録名を入力">
            <button id="regStartBtn" onclick="startFaceRegistration()">開始</button>
        </div>
        
        <div style="margin-top: 10px;">
            <button id="regNextBtn" onclick="proceedToNextStep()" disabled style="width:100%; padding:15px; font-size:1.2em; background-color:#ccc; border:none; border-radius:5px; color:white; font-weight:bold;">
                撮影・次へ
            </button>
        </div>
        
        <div id="regStatus" style="font-weight: bold; color: #007bff; margin-top: 10px;">待機中...</div>
    </div>
</div>

<script src="pre_script.js"></script>
</body>
</html>
