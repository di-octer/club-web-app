<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>連絡フォーム</title>
    <link rel="stylesheet" href="pre_style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body id="page-form">
  <main class="content">
    <div class="container">
        <h2>欠席・遅刻連絡</h2>
        <div class="form-box">
            <select id="reportType" onchange="toggleFormInputs()">
                <option value="absence">欠席</option>
                <option value="late">遅刻</option>
                <option value="early">早退</option>
            </select>
            <div id="input-date-range"><input type="date" id="reportStartDate"><input type="date" id="reportEndDate"></div>
            <div id="input-datetime" style="display:none;"><input type="datetime-local" id="reportDateTime"></div>
            <textarea id="reportReason" rows="4" placeholder="理由"></textarea>
            <input type="file" id="reportImage" accept="image/*">
            <button onclick="submitReport()">送信</button>
        </div>
    </div>
  </main>
  <script src="pre_script.js"></script>
</body>
</html>
