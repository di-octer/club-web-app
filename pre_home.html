<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ホーム | 統合アプリ</title>
  <link rel="stylesheet" href="pre_style.css">
  <style>
      .appbar { background-color: #007bff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
      .appbar a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
      .logo { font-size: 1.5em; font-weight: bold; }
      .content { padding: 40px; max-width: 800px; margin: 0 auto; text-align: center; }
      ul { list-style: none; padding: 0; }
      li { margin: 15px 0; }
      li a { display: block; padding: 15px; background: white; border-radius: 8px; text-decoration: none; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
      li a:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
      
      /* ニュース用スタイル */
      .news-block { margin-bottom: 20px; text-align: left; }
      .news-block h3 { border-left: 5px solid #007bff; padding-left: 10px; font-size: 1.2em; margin-bottom: 10px; background: #f0f8ff; padding: 8px; border-radius: 0 5px 5px 0; }
      .news-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: flex-start; }
      .news-item:last-child { border-bottom: none; }
      .news-item a { text-decoration: none; color: #333; font-weight: bold; display: block; }
      .news-item a:hover { color: #007bff; text-decoration: underline; }
      /* --- カルーセル・ニュース用スタイル --- */
      #news-section {
          overflow: hidden; /* はみ出した部分を隠す */
          width: 100%;
          position: relative;
      }
      .news-track {
          display: flex;
          transition: transform 0.3s ease-in-out;
          width: 200%; /* スライド2枚分 */
      }
      .news-slide {
          width: 50%; /* 全体の半分（1画面分） */
          padding: 0 10px;
          box-sizing: border-box;
      }
      
      /* ニュースヘッダー（左右ナビ付き） */
      .news-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: #f0f8ff;
          padding: 8px;
          border-radius: 5px;
          border-left: 5px solid #007bff;
          margin-bottom: 10px;
      }
      .news-header h3 {
          margin: 0;
          font-size: 1.1em;
          border: none;
          background: none;
          padding: 0;
      }
      .nav-hint {
          font-size: 0.8em;
          color: #007bff;
          cursor: pointer;
          user-select: none;
          white-space: nowrap;
      }
      .nav-hint:hover { text-decoration: underline; }

      /* 表示数切り替えトグル */
      .toggle-btn {
          display: block;
          width: 100%;
          padding: 5px;
          background: #eee;
          border: none;
          border-radius: 4px;
          color: #555;
          font-size: 0.8em;
          cursor: pointer;
          margin: 5px 0;
      }
      .toggle-btn:hover { background: #ddd; }
      
      /* 初期状態で隠すアイテム */
      .hidden-item { display: none !important; }
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>  
  <main class="content">
    <div id="news-section">
        <div class="news-track" id="newsTrack">
            <div class="news-slide" id="slide-rec">
                <p>読み込み中...</p>
            </div>
            <div class="news-slide" id="slide-trend">
                <p>読み込み中...</p>
            </div>
        </div>
    </div>

    <hr style="margin: 30px 0;">
    
    <h2>機能一覧</h2>
    <ul>
      <li><a href="pre_index.html">📷 出席認証 (GPS + 顔認証)</a></li>
      <li><a href="pre_check.html">📅 出席履歴の確認</a></li>
      <li><a href="pre_curriculum.html">📚 カリキュラム学習</a></li>
      <li><a href="pre_form.html">📝 欠席・遅刻連絡フォーム</a></li>
      <li><a href="pre_calendar.html">🗓 活動カレンダー</a></li>
      <li><a href="pre_portfolio.html">🎨 ポートフォリオ・作品集</a></li>
      <li><a href="pre_settings.html">⚙️ 設定 / 管理者メニュー</a></li>
    </ul>
  </main>

  <script src="pre_script.js"></script>
</body>
</html>
