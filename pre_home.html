<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ホーム | 統合アプリ</title>
  <link rel="stylesheet" href="pre_style.css">
  <style>
      #news-section { overflow: hidden; width: 100%; position: relative; }
      .news-track { display: flex; transition: transform 0.3s ease-in-out; width: 200%; }
      .news-slide { width: 50%; padding: 0 10px; box-sizing: border-box; }
      .news-header { display: flex; justify-content: space-between; align-items: center; background: #f0f8ff; padding: 8px; border-radius: 5px; border-left: 5px solid #007bff; margin-bottom: 10px; }
      .nav-hint { font-size: 0.8em; color: #007bff; cursor: pointer; user-select: none; }
      .toggle-btn { display: block; width: 100%; padding: 5px; background: #eee; border: none; border-radius: 4px; color: #555; cursor: pointer; margin: 5px 0; }
      .hidden-item { display: none !important; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>  
  <main class="content">
    <div id="news-section">
        <div class="news-track" id="newsTrack">
            <div class="news-slide" id="slide-rec"><p>読み込み中...</p></div>
            <div class="news-slide" id="slide-trend"><p>読み込み中...</p></div>
        </div>
    </div>
    <hr style="margin: 30px 0;">
    <h2>機能一覧</h2>
    <ul>
      <li><a href="pre_index.html">📷 出席認証</a></li>
      <li><a href="pre_check.html">📅 出席履歴</a></li>
      <li><a href="pre_curriculum.html">📚 カリキュラム</a></li>
      <li><a href="pre_form.html">📝 欠席・遅刻連絡</a></li>
      <li><a href="pre_settings.html">⚙️ 設定</a></li>
    </ul>
  </main>
  <script src="pre_script.js"></script>
</body>
</html>
