<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム | 部活出席アプリ</title>
    <link rel="stylesheet" href="pre_style.css">
    <style>
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 40px;
        }
        .menu-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .title {
            font-size: 1.2em;
            font-weight: bold;
        }
        .admin-link {
            margin-top: 50px;
            display: inline-block;
            color: #666;
            font-size: 0.9em;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <header style="margin-bottom: 30px;">
        <h1>部活出席アプリ</h1>
        <p>（Pre環境）</p>
    </header>

    <div class="menu-grid">
        <!-- 1. 出席ボタン -->
        <a href="pre_index.html" class="menu-card">
            <div class="icon">📷</div>
            <div class="title">出席する</div>
            <p>GPSと顔認証で出席を記録します</p>
        </a>

        <!-- 2. 履歴ボタン -->
        <a href="pre_check.html" class="menu-card">
            <div class="icon">📅</div>
            <div class="title">履歴を見る</div>
            <p>今月の出席状況を確認します</p>
        </a>
    </div>

    <!-- 3. 管理者リンク -->
    <a href="pre_admin.html" class="admin-link">管理者コンソールへ</a>
</div>

</body>
</html>
