<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出席認証</title>
    <link rel="stylesheet" href="pre_style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body id="page-user">
<div class="user-container">
    <h2>出席認証</h2>
    <div id="step-0" class="step-content active">
        <p>ようこそ <span id="displayUserName"></span> さん</p>
        <button onclick="startUserAuthFlow()">認証を開始する</button>
    </div>
    <div id="step-1" class="step-content">
        <h3>本人確認</h3>
        <p id="userStatus">準備中...</p>
        <div class="camera-wrapper"><video id="userVideo" autoplay muted playsinline></video><canvas id="userCanvas" class="overlay"></canvas></div>
    </div>
    <div id="step-2" class="step-content">
        <h3>承認待機中</h3>
        <canvas id="codeCanvas" width="300" height="300"></canvas>
        <button onclick="checkRequestStatus()">結果を確認</button>
    </div>
    <div id="step-3" class="step-content">
        <h3>認証成功！</h3>
        <a href="pre_check.html">履歴を確認</a>
    </div>
</div>
<script src="pre_script.js"></script>
</body>
</html>
