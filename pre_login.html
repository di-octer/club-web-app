<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | 統合アプリ</title>
    <link rel="stylesheet" href="pre_style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #f0f2f5; font-family: sans-serif;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;
            width: 90%; max-width: 400px;
        }
        .discord-btn {
            background-color: #5865F2; color: white; border: none; padding: 12px;
            width: 100%; border-radius: 5px; font-size: 1.1em; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: background 0.3s;
        }
        .discord-btn:hover { background-color: #4752C4; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>部活動アプリ</h2>
        <p>Discordアカウントでログインしてください</p>
        <button class="discord-btn" onclick="loginWithDiscord()">

        <p id="errorMsg" style="color:red; font-size:0.9em; margin-top:10px;"></p>
    </div>
    <script src="pre_script.js"></script>
</body>
</html>
